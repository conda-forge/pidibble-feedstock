{% set name = "pidibble" %}
{% set version = "1.12.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pidibble-{{ version }}.tar.gz
  sha256: 754a8e0e8677f7dd00be5fbca998ee730c81674a88303ba111a556fb089aba34

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - pyyaml >=6
    # mmcif (wwPDB py-mmcif) is an optional extra upstream and is not on
    # conda-forge; mmCIF input raises an ImportError naming the fix without it.

test:
  imports:
    - pidibble
    - pidibble.pdbparse
    - pidibble.pdbwrite
    - pidibble.citation
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: A complete Protein Data Bank (PDB) file parser
  home: https://github.com/cameronabrams/pidibble
  dev_url: https://github.com/cameronabrams/pidibble
  doc_url: https://pidibble.readthedocs.io/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cameronabrams
